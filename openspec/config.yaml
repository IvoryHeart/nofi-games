schema: system-change

context: |
  Product: one cross-platform Godot player app with a research-selected catalog of versioned game packs.
  Runtime: Godot 4.7.1 Compatibility renderer and typed GDScript.
  Agent execution: Codex is the primary native harness; Claude Code remains adoptable through the same OpenSpec/Git protocol. Codex defaults bounded implementation to GPT-5.6 Luna xhigh and high-judgment work to GPT-5.6 Sol xhigh.
  Control plane: OpenSpec and Git for tasks/checkpoints, strict TypeScript contracts, GitHub Actions, and Vercel previews.
  Knowledge: OpenSpec and Git hold accepted intent and compact evidence; object storage holds large evidence. Supabase is reserved for product runtime data, not local agent coordination.
  Agent changes use champion/challenger evaluation and independent promotion.
  Consequential tasks default to decision-sufficient execution: cheapest decisive checks first, one bounded retry, explicit unavailable gates, and stop-and-report once the decision is fixed.
  Monetization and per-game store applications are out of scope.

rules:
  strategic-premise:
    - Restate the outcome without embedding a solution and enumerate required capabilities.
    - Inspect repository and authoritative current sources for existing capabilities before choosing construction.
    - Compare reuse, adaptation, construction, and doing nothing; name disconfirming signals and rollback.
    - Distinguish control plane, execution harness, model, persistence, and product runtime when relevant.
  proposal:
    - State the evidence, falsifiable outcome, non-goals, and rollback boundary.
    - Identify whether player, game-pack, agent, catalog, or infrastructure behavior changes.
  specs:
    - Use observable SHALL requirements with deterministic scenarios where possible.
    - Never encode an assumed game genre portfolio as a platform requirement.
  design:
    - Pin affected contracts and version boundaries.
    - Explain failure recovery and evidence provenance.
  tasks:
    - Include tests, evaluation, documentation, and rollback work as first-class tasks.
    - State the decision question, minimum sufficient evidence, retry/probe limits, unavailable dependencies, and decisive stop conditions.

operations:
  apply:
    guidance:
      - Preserve the single-app and research-selected-catalog invariants.
      - Stop on hidden, swallowed, or non-reproducible failures.
  archive:
    guidance:
      - Archive only after verification evidence and a decision are recorded.
