schema: spec-driven

context: |
  Product: one cross-platform Godot player app with a research-selected catalog of versioned game packs.
  Runtime: Godot 4.7.1 Compatibility renderer and typed GDScript.
  Direction: an agent-operated studio continuously researches, creates, evaluates, releases, observes, and improves the catalog.
  Foundation: OpenSpec records agreements; deterministic code owns future orchestration; bounded agents provide judgment; run records hold operational facts; humans own authority policy.
  Authority: policy is directly human-approved; only bounded acceptance, release, and promotion actions may later be delegated under deterministic fail-closed rules.
  Current state: the player and game-pack substrate exists; no autonomous studio workflow or agent-runtime persistence is implemented.
  Monetization and per-game store applications are out of scope.

rules:
  proposal:
    - Keep the change concise; state why, scope, affected capabilities, non-goals, and rollback.
  specs:
    - Use observable SHALL requirements with deterministic scenarios where possible.
    - Never encode an assumed game genre portfolio as a platform requirement.
  design:
    - Include design only when consequential reasoning, alternatives, failure recovery, or migration would otherwise be lost.
  tasks:
    - Make checks, documentation, and rollback executable work rather than separate evidence artifacts.

operations:
  apply:
    guidance:
      - Preserve the single-app and research-selected-catalog invariants.
      - Stop on hidden, swallowed, or non-reproducible failures.
  archive:
    guidance:
      - Archive only after tasks and deterministic checks pass and the change has valid acceptance authority.
