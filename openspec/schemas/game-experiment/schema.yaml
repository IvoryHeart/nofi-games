name: game-experiment
version: 1
description: Evidence-driven improvement of a versioned game pack
artifacts:
  - id: evidence
    generates: evidence.md
    description: Reproducible observation of a gameplay opportunity or failure
    template: evidence.md
    instruction: Describe the observed behavior, provenance, affected cohorts, uncertainty, and baseline version.
    requires: []
  - id: hypothesis
    generates: hypothesis.md
    description: Falsifiable causal improvement hypothesis
    template: hypothesis.md
    instruction: State the intervention, expected effect, mechanism, protected metrics, and disconfirming result.
    requires: [evidence]
  - id: specs
    generates: specs/**/*.md
    description: Requirement deltas implied by the experiment
    template: spec.md
    instruction: Express behavioral deltas using OpenSpec requirement operations and WHEN/THEN scenarios.
    requires: [hypothesis]
  - id: experiment-plan
    generates: experiment-plan.md
    description: Precommitted comparison, assignment, sample, and decision rules
    template: experiment-plan.md
    instruction: Pin baseline, candidate, metrics, segmentation, stopping rule, and rollback trigger.
    requires: [specs]
  - id: design
    generates: design.md
    description: Candidate implementation and instrumentation design
    template: design.md
    instruction: Explain the minimal intervention and how exposure and outcomes will be attributed.
    requires: [experiment-plan]
  - id: tasks
    generates: tasks.md
    description: Trackable implementation and experiment tasks
    template: tasks.md
    instruction: Create numbered checkbox tasks for implementation, validation, rollout, analysis, and rollback.
    requires: [design]
  - id: results
    generates: results.md
    description: Immutable analysis and data-quality results
    template: results.md
    instruction: Account for all planned metrics as measured, unmet, unknown, or stopped after the frozen decision resolved; report uncertainty, exclusions, anomalies, decisive evidence, and links to raw evidence.
    requires: [tasks]
  - id: decision
    generates: decision.md
    description: Promote, reject, continue, or roll back decision
    template: decision.md
    instruction: Apply the precommitted decision rule and explain any deviation.
    requires: [results]
  - id: retrospective
    generates: retrospective.md
    description: Reusable experiment and gameplay lessons
    template: retrospective.md
    instruction: Route supported lessons to specs, skills, evals, or follow-up proposals.
    requires: [decision]
apply:
  requires: [tasks]
  tracks: tasks.md
