schemaVersion: 1
id: terra-champion
version: 0.1.0
provider: openai
champion:
  model: gpt-5.6-terra
  reasoningEffort: medium
  reasoningContext: all_turns
promptCaching:
  enabled: false
  prefixVersion: studio-runtime-v1
escalation:
  enabled: true
  model: gpt-5.6-sol
  allowedReasons:
    - protected-evaluation-failure
    - bounded-repair-exhausted
    - approved-complexity-class
  maximumPerAttempt: 1
challengers:
  - model: gpt-5.6-sol
    enabled: false
    requiresLowerCost: false
  - model: gpt-5.6-luna
    enabled: false
    requiresLowerCost: true
evaluationSuite: agent-core
liveEnabled: false
