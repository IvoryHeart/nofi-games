schemaVersion: 1
id: agent-evolution
version: 0.1.0
trigger: evaluation-failure
rollbackRequired: true
stages:
  - id: improvement-observation
    agent: agent-improver
    skill: evolve-agent
    changeSchema: agent-evolution
    dependsOn: []
    consumes: [failed-run-evidence]
    produces: [improvement-hypothesis, frozen-eval-plan]
    gates: [reproducible-failure, protected-holdout, rollback-version]
    mutatesSource: false
    mayPublishPreview: false
    mayPublishProduction: false
  - id: challenger-build
    agent: agent-improver
    skill: evolve-agent
    changeSchema: agent-evolution
    dependsOn: [improvement-observation]
    consumes: [improvement-hypothesis, frozen-eval-plan]
    produces: [challenger-manifest, exact-diff]
    gates: [single-hypothesis, immutable-champion, holdout-hidden]
    mutatesSource: true
    mayPublishPreview: false
    mayPublishProduction: false
  - id: independent-agent-evaluation
    agent: agent-evaluator
    skill: evolve-agent
    changeSchema: agent-evolution
    dependsOn: [challenger-build]
    consumes: [challenger-manifest, frozen-eval-plan]
    produces: [comparison-results, promotion-verdict]
    gates: [fresh-evaluator-instance, repeated-trials, protected-metrics]
    mutatesSource: false
    mayPublishPreview: false
    mayPublishProduction: false
  - id: agent-canary
    agent: release-manager
    skill: publish-game-pack
    changeSchema: agent-evolution
    dependsOn: [independent-agent-evaluation]
    consumes: [challenger-manifest, promotion-verdict]
    produces: [canary-evidence, rollback-record]
    gates: [bounded-cohort, automatic-rollback, independent-promotion]
    mutatesSource: false
    mayPublishPreview: true
    mayPublishProduction: true
